name: BroadAppTemplate

configs:
  Debug: debug
  Release: release
  LiveAdapty5013: debug
  LiveAdapty5109Codex: debug

options:
  bundleIdPrefix: com.broadapps.platform
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  BroadCore:
    url: https://github.com/BroadApps-official/broad-core-ios.git
    exactVersion: 1.1.0
  BroadMonetization:
    url: https://github.com/BroadApps-official/broad-monetization-ios.git
    exactVersion: 1.1.0
  BroadUIFlows:
    url: https://github.com/BroadApps-official/broad-ui-flows-ios.git
    exactVersion: 1.0.1
  BroadExtensions:
    url: https://github.com/BroadApps-official/broad-extensions-ios.git
    exactVersion: 1.0.1
  Swinject:
    url: https://github.com/Swinject/Swinject.git
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  BroadAppTemplate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BroadAppTemplate
    dependencies:
      - package: BroadCore
        product: BroadCore
      - package: BroadMonetization
        product: BroadMonetization
      - package: BroadUIFlows
        product: BroadUIFlows
      - package: BroadExtensions
        product: BroadExtensions
      - package: Swinject
        product: Swinject
    configFiles:
      LiveAdapty5013: Configuration/Adapty5013.xcconfig
      LiveAdapty5109Codex: Configuration/Adapty5109Codex.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.broadapps.platform.template
        PRODUCT_NAME: BroadAppTemplate
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_BroadAppsFixtureOnly: true
        INFOPLIST_KEY_CFBundleDisplayName: Broad Platform
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSUserTrackingUsageDescription: Tracking permission is requested only after the first onboarding slide appears.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        LiveAdapty5013:
          GENERATE_INFOPLIST_FILE: false
          INFOPLIST_FILE: Configuration/LiveAdaptyInfo.plist
          PRODUCT_BUNDLE_IDENTIFIER: $(BROADAPPS_LIVE_ADAPTY_BUNDLE_ID)
        LiveAdapty5109Codex:
          GENERATE_INFOPLIST_FILE: false
          INFOPLIST_FILE: Configuration/LiveAdaptyInfo.plist
          PRODUCT_BUNDLE_IDENTIFIER: $(BROADAPPS_LIVE_ADAPTY_BUNDLE_ID)
    scheme:
      gatherCoverageData: false

schemes:
  BroadAppTemplateLiveAdapty5013:
    build:
      targets:
        BroadAppTemplate: all
    run:
      config: LiveAdapty5013
      commandLineArguments:
        "-live-adapty": true
        "-tracking-disabled": true
  BroadAppTemplateLiveAdapty5109Codex:
    build:
      targets:
        BroadAppTemplate: all
    run:
      config: LiveAdapty5109Codex
      commandLineArguments:
        "-live-adapty": true
        "-tracking-disabled": true
