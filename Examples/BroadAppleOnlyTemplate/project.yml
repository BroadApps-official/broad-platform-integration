name: BroadAppleOnlyTemplate

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"

packages:
  BroadUIFlows:
    url: https://github.com/BroadApps-official/broad-ui-flows-ios.git
    exactVersion: 5.0.0
  BroadCore:
    url: https://github.com/BroadApps-official/broad-core-ios.git
    exactVersion: 3.0.0
  BroadMonetization:
    url: https://github.com/BroadApps-official/broad-monetization-ios.git
    exactVersion: 5.1.0

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

targets:
  BroadAppleOnlyTemplate:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: BroadUIFlows
        product: BroadUIFlows
      - package: BroadCore
        product: BroadCore
      - package: BroadMonetization
        product: BroadMonetization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.broadapps.platform.apple-only-template
        PRODUCT_NAME: BroadAppleOnlyTemplate
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_BroadAppsFixtureOnly: YES
        INFOPLIST_KEY_CFBundleDisplayName: Apple Only Template
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      gatherCoverageData: false
