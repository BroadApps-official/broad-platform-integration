<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
  <title id="title">Простой путь Adapty placement до paywall UI</title>
  <desc id="description">Приложение передаёт public SDK key и placement ID, Adapty возвращает paywall, все продукты и payload, платформа без фильтрации передаёт их в UI.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#172554"/><stop offset="1" stop-color="#052E2B"/></linearGradient><filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#94A3B8"/></marker></defs>
  <rect width="1280" height="560" rx="34" fill="url(#background)"/><text x="52" y="62" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="800">Adapty без лишних слоёв</text><text x="52" y="96" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Ключ и placement на входе. Весь ответ провайдера — на экране.</text>
  <g filter="url(#shadow)"><rect x="52" y="146" width="250" height="230" rx="26" fill="#0F172A" stroke="#60A5FA" stroke-width="3"/><rect x="364" y="146" width="250" height="230" rx="26" fill="#0F172A" stroke="#A78BFA" stroke-width="3"/><rect x="676" y="146" width="250" height="230" rx="26" fill="#0F172A" stroke="#34D399" stroke-width="3"/><rect x="988" y="146" width="240" height="230" rx="26" fill="#0F172A" stroke="#FBBF24" stroke-width="3"/></g>
  <text x="78" y="184" fill="#93C5FD" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">01 · HOST APP</text><text x="78" y="228" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">Public SDK key</text><text x="78" y="262" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">+ placement ID</text><text x="78" y="316" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Один composition root.</text><text x="78" y="342" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Без verifier и REST.</text><line x1="314" y1="261" x2="348" y2="261" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="390" y="184" fill="#C4B5FD" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">02 · ADAPTY</text><text x="390" y="228" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">getPaywall</text><text x="390" y="262" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">getProducts</text><text x="390" y="316" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Network, SDK cache или</text><text x="390" y="342" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Dashboard fallback — внутри SDK.</text><line x1="626" y1="261" x2="660" y2="261" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="702" y="184" fill="#6EE7B7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">03 · PLATFORM</text><text x="702" y="228" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">Paywall + payload</text><text x="702" y="262" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">+ все 0…N products</text><text x="702" y="316" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Без filter, sort, truncate</text><text x="702" y="342" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">или повторной загрузки.</text><line x1="938" y1="261" x2="972" y2="261" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1014" y="184" fill="#FDE68A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">04 · UI</text><text x="1014" y="228" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">Что вернул</text><text x="1014" y="262" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">placement — то</text><text x="1014" y="296" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">и показываем</text><text x="1014" y="342" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Subscription, tokens, offer.</text>
  <rect x="52" y="420" width="1176" height="92" rx="20" fill="#020617" stroke="#334155"/><circle cx="82" cy="466" r="9" fill="#34D399"/><text x="106" y="460" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="800">Единое правило платформы</text><text x="106" y="487" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Особое число карточек конкретное приложение задаёт только в своём UI.</text>
</svg>
