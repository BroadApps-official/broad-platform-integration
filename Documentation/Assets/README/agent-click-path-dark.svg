<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Куда нажимать при работе с Codex или Claude</title>
  <desc id="description">Пошаговый визуальный маршрут: открыть папку нового приложения, приложить источники и отправлять prompts по одному, проверяя developer checkpoint после каждого этапа.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="0.52" stop-color="#111827"/><stop offset="1" stop-color="#24113B"/></linearGradient>
    <linearGradient id="chat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D4ED8"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="1400" height="760" rx="36" fill="url(#bg)"/><circle cx="1310" cy="55" r="175" fill="#7C3AED" opacity="0.16"/><circle cx="65" cy="720" r="180" fill="#0EA5E9" opacity="0.12"/>
  <text x="60" y="62" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="800">КУДА НАЖИМАТЬ · МАРШРУТ С АГЕНТОМ</text><text x="60" y="94" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Пройдите слева направо. После каждого экрана переходите к следующей стрелке.</text>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="48" y="136" width="300" height="260" rx="28" fill="#172033" stroke="#60A5FA" stroke-width="3"/><rect x="48" y="136" width="300" height="46" rx="28" fill="#1E3A5F"/><circle cx="76" cy="159" r="7" fill="#FB7185"/><circle cx="98" cy="159" r="7" fill="#FBBF24"/><circle cx="120" cy="159" r="7" fill="#34D399"/><text x="198" y="165" text-anchor="middle" fill="#BFDBFE" font-size="16" font-weight="800">Finder</text><rect x="70" y="202" width="256" height="56" rx="16" fill="#152B4B"/><text x="88" y="224" fill="#93C5FD" font-size="13" font-weight="800">ШАГ 1</text><text x="88" y="247" fill="#F8FAFC" font-size="17" font-weight="800">Создать новую папку</text><path d="M88 286h34l10 10h92v58H88Z" fill="#3B82F6"/><path d="M88 296h136v58H88Z" fill="#60A5FA"/><text x="242" y="311" fill="#94A3B8" font-size="13">название папки:</text><text x="242" y="335" fill="#F8FAFC" font-size="13" font-weight="800">№ + название</text><text x="242" y="359" fill="#94A3B8" font-size="12">папка пока пустая</text>
    <rect x="398" y="136" width="300" height="260" rx="28" fill="#172033" stroke="#A78BFA" stroke-width="3"/><rect x="398" y="136" width="300" height="46" rx="28" fill="#312256"/><circle cx="426" cy="159" r="7" fill="#FB7185"/><circle cx="448" cy="159" r="7" fill="#FBBF24"/><circle cx="470" cy="159" r="7" fill="#34D399"/><text x="548" y="165" text-anchor="middle" fill="#DDD6FE" font-size="16" font-weight="800">Codex / Claude</text><text x="422" y="218" fill="#C4B5FD" font-size="13" font-weight="800">ШАГ 2</text><text x="422" y="244" fill="#F8FAFC" font-size="18" font-weight="800">Открыть рабочую папку</text><rect x="422" y="270" width="252" height="52" rx="16" fill="#7C3AED"/><text x="548" y="302" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800">Open Folder / Open Project</text><text x="548" y="348" text-anchor="middle" fill="#CBD5E1" font-size="14">Нажмите кнопку и выберите</text><text x="548" y="369" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">папку из шага 1</text>
    <rect x="748" y="136" width="300" height="260" rx="28" fill="#172033" stroke="#FB923C" stroke-width="3"/><rect x="748" y="136" width="300" height="46" rx="28" fill="#3B2416"/><circle cx="776" cy="159" r="7" fill="#FB7185"/><circle cx="798" cy="159" r="7" fill="#FBBF24"/><circle cx="820" cy="159" r="7" fill="#34D399"/><text x="898" y="165" text-anchor="middle" fill="#FED7AA" font-size="16" font-weight="800">Выбор папки</text><text x="772" y="218" fill="#FDBA74" font-size="13" font-weight="800">ШАГ 3</text><text x="772" y="244" fill="#F8FAFC" font-size="18" font-weight="800">Проверить путь</text><rect x="772" y="266" width="252" height="54" rx="14" fill="#2B1D17" stroke="#FB923C"/><text x="790" y="288" fill="#94A3B8" font-size="12">выбрана:</text><text x="790" y="309" fill="#F8FAFC" font-size="15" font-weight="800">…/№ НовоеПриложение</text><rect x="772" y="338" width="112" height="36" rx="12" fill="#EA580C"/><text x="828" y="361" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">Open</text><text x="902" y="361" fill="#CBD5E1" font-size="13">имя видно в окне</text>
    <rect x="1098" y="136" width="254" height="260" rx="28" fill="url(#chat)" stroke="#818CF8" stroke-width="3"/><text x="1122" y="181" fill="#DBEAFE" font-size="13" font-weight="800">ШАГ 4</text><text x="1122" y="209" fill="#FFFFFF" font-size="18" font-weight="800">Начать новый чат</text><rect x="1122" y="231" width="206" height="42" rx="14" fill="#FFFFFF" opacity="0.18"/><text x="1225" y="258" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">＋ New Chat</text><rect x="1122" y="291" width="206" height="72" rx="16" fill="#172033"/><text x="1138" y="316" fill="#C4B5FD" font-size="12" font-weight="800">ПРИЛОЖИТЬ</text><text x="1138" y="338" fill="#F8FAFC" font-size="13" font-weight="700">Kaiten + источник дизайна</text><text x="1138" y="357" fill="#CBD5E1" font-size="12">reference либо «НАЙДИ»</text>
  </g>
  <path d="M348 266H384M698 266H734M1048 266H1084" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1225 396V432H700V454" fill="none" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="48" y="468" width="1304" height="132" rx="28" fill="#172033" stroke="#A78BFA" stroke-width="3" filter="url(#shadow)"/><text x="78" y="508" fill="#C4B5FD" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">ШАГ 5 · В ПОЛЕ СООБЩЕНИЯ</text><rect x="78" y="528" width="874" height="46" rx="15" fill="#251D3B"/><text x="98" y="557" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Отправляйте prompts из Prompt Pack по одному — не объединяйте этапы</text><rect x="978" y="520" width="162" height="58" rx="18" fill="#7C3AED"/><text x="1059" y="555" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">Отправить ↑</text><text x="1164" y="543" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">прочитать</text><text x="1164" y="563" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="800">checkpoint</text>
  <path d="M700 600V628" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="642" width="396" height="74" rx="23" fill="#3A1822" stroke="#FB7185" stroke-width="2"/><text x="246" y="672" text-anchor="middle" fill="#FDA4AF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">НЕ ОТКРЫВАТЬ ВМЕСТО РАБОЧЕЙ ПАПКИ</text><text x="246" y="697" text-anchor="middle" fill="#FFE4E6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">reference или BroadAppsIOSPlatform</text><path d="M444 679H480" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/><rect x="498" y="642" width="854" height="74" rx="23" fill="url(#done)"/><text x="925" y="672" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800">СЛЕДОМ: PREFLIGHT → PLAN → SKELETON → SLICE → REVIEWS → ACCEPTANCE</text><text x="925" y="697" text-anchor="middle" fill="#D1FAE5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">каждый переход подтверждает разработчик; BLOCKED не маскируется</text>
</svg>
