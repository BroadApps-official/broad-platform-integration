<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title description">
  <title id="title">Как собрать зависимости приложения в одном месте</title><desc id="description">AppConfiguration и adapters передаются через BroadCore, BroadMonetization и BroadUIFlows в готовый SwiftUI root. Ниже перечислены шесть обязательных ограничителей безопасности.</desc>
  <defs><filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs>
  <rect width="1280" height="650" rx="32" fill="#F8FAFC"/><text x="52" y="58" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="29" font-weight="800">Composition root: приложение собирается один раз</text><text x="52" y="88" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">View получает готовую ViewModel. SDK, HTTP-клиенты и DI-контейнеры внутри SwiftUI View не создаются.</text>
  <path d="M252 180H284M490 180H522M750 180H782M1000 180H1032" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="52" y="126" width="200" height="108" rx="23" fill="#F59E0B"/><rect x="296" y="126" width="194" height="108" rx="23" fill="#3B82F6"/><rect x="534" y="126" width="216" height="108" rx="23" fill="#10B981"/><rect x="794" y="126" width="206" height="108" rx="23" fill="#EC4899"/><rect x="1044" y="126" width="184" height="108" rx="23" fill="#0F172A"/></g>
  <text x="152" y="164" text-anchor="middle" fill="#422006" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="800">AppConfiguration</text><text x="152" y="190" text-anchor="middle" fill="#713F12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">аккаунт • URL • adapters</text><text x="152" y="211" text-anchor="middle" fill="#713F12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">feature flags • IDs</text>
  <text x="393" y="188" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800">BroadCore</text><text x="642" y="188" text-anchor="middle" fill="#052E16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">BroadMonetization</text><text x="897" y="188" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">BroadUIFlows</text><text x="1136" y="176" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">Root SwiftUI</text><text x="1136" y="202" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">готовые ViewModel</text>
  <rect x="52" y="268" width="382" height="54" rx="18" fill="#8B5CF6"/><text x="243" y="291" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800">BroadExtensions · отдельно и опционально</text><text x="243" y="311" text-anchor="middle" fill="#EDE9FE" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">подключается приложением, не тянет монетизацию</text>
  <text x="52" y="376" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800">Шесть ограничителей, которые нельзя размножать по экранам</text>
  <g filter="url(#shadow)"><rect x="52" y="406" width="360" height="88" rx="20" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/><rect x="460" y="406" width="360" height="88" rx="20" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><rect x="868" y="406" width="360" height="88" rx="20" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/><rect x="52" y="522" width="360" height="88" rx="20" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><rect x="460" y="522" width="360" height="88" rx="20" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/><rect x="868" y="522" width="360" height="88" rx="20" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/></g>
  <text x="76" y="438" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">1 gate на финансовые операции</text><text x="76" y="466" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">не даёт запустить один платёж дважды</text><text x="484" y="438" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">1 постоянный безопасный кеш</text><text x="484" y="466" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">хранит состояние, но не выдаёт premium</text><text x="892" y="438" fill="#BE185D" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">1 EntitlementSubject</text><text x="892" y="466" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">один пользователь для всех источников</text>
  <text x="76" y="554" fill="#B45309" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">Только настроенные providers</text><text x="76" y="582" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">StoreKit, RU и backend не создаются «на всякий»</text><text x="484" y="554" fill="#6D28D9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">Конечный timeout и retry</text><text x="484" y="582" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">нет сети → понятное состояние и повтор</text><text x="892" y="554" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">ATT вне loader и bootstrap</text><text x="892" y="582" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">только после появления 1-го слайда</text>
</svg>
