<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
  <title id="title">Адаптивный paywall</title>
  <desc id="description">Три состояния paywall: ноль продуктов, один продукт и много продуктов со scroll и sticky controls.</desc>
  <defs><filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
  <rect width="1280" height="560" rx="30" fill="#F8FAFC"/>
  <text x="48" y="56" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="800">Один UI для любого количества продуктов</text>
  <text x="48" y="86" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Provider order сохраняется. Одинаковые SKU остаются отдельными строками.</text>
  <g filter="url(#shadow)">
    <rect x="92" y="122" width="286" height="384" rx="40" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="497" y="122" width="286" height="384" rx="40" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="902" y="122" width="286" height="384" rx="40" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  </g>
  <text x="235" y="164" text-anchor="middle" fill="#EC4899" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">0 PRODUCTS</text>
  <rect x="124" y="194" width="222" height="148" rx="22" fill="#FDF2F8"/>
  <circle cx="235" cy="234" r="18" fill="#F9A8D4"/>
  <text x="235" y="278" text-anchor="middle" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Safe empty state</text>
  <text x="235" y="304" text-anchor="middle" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">retry • restore • close</text>
  <rect x="124" y="430" width="222" height="48" rx="16" fill="#EC4899"/>
  <text x="235" y="460" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">TRY AGAIN</text>

  <text x="640" y="164" text-anchor="middle" fill="#EC4899" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">1 PRODUCT</text>
  <text x="529" y="201" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800">Choose your plan</text>
  <rect x="529" y="228" width="222" height="98" rx="18" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <text x="550" y="261" fill="#065F46" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">Provider title</text>
  <text x="550" y="291" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Real price • period</text>
  <circle cx="721" cy="248" r="9" fill="#10B981"/>
  <rect x="529" y="386" width="222" height="48" rx="16" fill="#EC4899"/>
  <text x="640" y="416" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">CONTINUE</text>
  <text x="640" y="463" text-anchor="middle" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Restore • Privacy • Terms</text>

  <text x="1045" y="164" text-anchor="middle" fill="#EC4899" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">N PRODUCTS</text>
  <text x="934" y="201" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800">Provider order</text>
  <rect x="934" y="224" width="222" height="50" rx="14" fill="#F1F5F9"/>
  <rect x="934" y="284" width="222" height="50" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <rect x="934" y="344" width="222" height="50" rx="14" fill="#F1F5F9"/>
  <rect x="934" y="404" width="222" height="16" rx="8" fill="#E2E8F0"/>
  <circle cx="1136" cy="309" r="7" fill="#10B981"/>
  <rect x="934" y="438" width="222" height="48" rx="16" fill="#EC4899"/>
  <text x="1045" y="468" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800">STICKY CTA</text>
</svg>
