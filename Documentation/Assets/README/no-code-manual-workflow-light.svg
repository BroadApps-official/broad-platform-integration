<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title description">
  <title id="title">No-code-разработка вручную в Xcode</title>
  <desc id="description">Разработчик вручную проходит Integration Plan, skeleton, vertical slices, functional review, visual review и acceptance по тем же правилам, что агент.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7ED"/><stop offset="0.5" stop-color="#F8FAFC"/><stop offset="1" stop-color="#FDF2F8"/></linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748B" flood-opacity="0.22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
  </defs>
  <rect width="1400" height="720" rx="36" fill="url(#bg)"/><circle cx="1280" cy="80" r="170" fill="#FB7185" opacity="0.12"/><circle cx="70" cy="680" r="180" fill="#FB923C" opacity="0.12"/>
  <text x="60" y="62" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="800">NO-CODE ВРУЧНУЮ · БЕЗ АГЕНТА</text>
  <text x="60" y="94" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Без агента меняется исполнитель, но не stages: Plan → skeleton → slices → reviews → acceptance.</text>

  <text x="60" y="145" fill="#C2410C" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">СНАЧАЛА ПОДГОТОВЬТЕ ИСХОДНИКИ</text>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="60" y="166" width="390" height="118" rx="24" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/><text x="90" y="200" fill="#C2410C" font-size="14" font-weight="800">1 · KAITEN</text><text x="90" y="230" fill="#0F172A" font-size="19" font-weight="800">Карточка с меткой no-code</text><text x="90" y="257" fill="#475569" font-size="14">документ проекта и доступные данные</text>
    <rect x="505" y="166" width="390" height="118" rx="24" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/><text x="535" y="200" fill="#6D28D9" font-size="14" font-weight="800">2 · СОГЛАСОВАННЫЙ ДИЗАЙН</text><text x="535" y="230" fill="#0F172A" font-size="19" font-weight="800">Claude Design или Pencil</text><text x="535" y="257" fill="#475569" font-size="14">экраны, состояния, тексты и assets</text>
    <rect x="950" y="166" width="390" height="118" rx="24" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/><text x="980" y="200" fill="#0369A1" font-size="14" font-weight="800">3 · REFERENCE И BACKEND</text><text x="980" y="230" fill="#0F172A" font-size="19" font-weight="800">Только читать и сверять</text><text x="980" y="257" fill="#475569" font-size="14">сценарии, API-ручки и контракты</text>
  </g>
  <path d="M700 284V326" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="60" y="368" fill="#BE185D" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">ЗАТЕМ СОБЕРИТЕ ПРИЛОЖЕНИЕ В XCODE</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="60" y="392" width="226" height="126" rx="24" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/><text x="173" y="426" fill="#C2410C" font-size="14" font-weight="800">4 · INTEGRATION PLAN</text><text x="173" y="457" fill="#0F172A" font-size="18" font-weight="800">Screens · API · owners</text><text x="173" y="484" fill="#475569" font-size="14">до первого Swift-файла</text>
    <rect x="322" y="392" width="226" height="126" rx="24" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/><text x="435" y="426" fill="#1D4ED8" font-size="14" font-weight="800">5 · SKELETON</text><text x="435" y="457" fill="#0F172A" font-size="18" font-weight="800">Target + package + DI</text><text x="435" y="484" fill="#475569" font-size="14">без app-specific догадок</text>
    <rect x="584" y="392" width="226" height="126" rx="24" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/><text x="697" y="426" fill="#6D28D9" font-size="14" font-weight="800">6 · ONE SLICE</text><text x="697" y="457" fill="#0F172A" font-size="18" font-weight="800">View → backend</text><text x="697" y="484" fill="#475569" font-size="14">один flow за раз</text>
    <rect x="846" y="392" width="226" height="126" rx="24" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/><text x="959" y="426" fill="#BE185D" font-size="14" font-weight="800">7 · REVIEWS</text><text x="959" y="457" fill="#0F172A" font-size="18" font-weight="800">Functional → Visual</text><text x="959" y="484" fill="#475569" font-size="14">developer checkpoints</text>
    <rect x="1108" y="392" width="232" height="126" rx="24" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="1224" y="426" fill="#047857" font-size="14" font-weight="800">8 · ACCEPTANCE</text><text x="1224" y="457" fill="#0F172A" font-size="18" font-weight="800">Debug + Release</text><text x="1224" y="484" fill="#475569" font-size="14">READY FOR QA / BLOCKED</text>
  </g>
  <path d="M286 455H308M548 455H570M810 455H832M1072 455H1094" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M700 518V558" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="126" y="578" width="1148" height="92" rx="28" fill="url(#done)" filter="url(#shadow)"/>
  <text x="700" y="615" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800">ГОТОВО: тот же результат, но ответственность за каждый шаг лежит на разработчике</text>
  <text x="700" y="645" text-anchor="middle" fill="#D1FAE5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">iPhone-приложение · проверенный пользовательский путь · временные данные перечислены · нерешённые вопросы зафиксированы</text>
</svg>
