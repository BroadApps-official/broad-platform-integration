<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title description">
  <title id="title">Полный flow приложения</title>
  <desc id="description">Launch, onboarding, paywall, purchase или restore, authoritative entitlement refresh и main.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94A3B8"/></marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.38"/></filter>
  </defs>
  <rect width="1400" height="360" rx="28" fill="#0F172A"/>
  <text x="50" y="52" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="800">Первый запуск до основного экрана</text>
  <text x="50" y="80" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Premium открывается только после нового authoritative entitlement refresh.</text>
  <g filter="url(#shadow)">
    <rect x="50" y="132" width="170" height="96" rx="22" fill="#3B82F6"/>
    <rect x="270" y="132" width="170" height="96" rx="22" fill="#EC4899"/>
    <rect x="490" y="132" width="170" height="96" rx="22" fill="#EC4899"/>
    <rect x="710" y="132" width="190" height="96" rx="22" fill="#10B981"/>
    <rect x="950" y="132" width="190" height="96" rx="22" fill="#10B981"/>
    <rect x="1190" y="132" width="160" height="96" rx="22" fill="#F59E0B"/>
  </g>
  <path d="M220 180H256M440 180H476M660 180H696M900 180H936M1140 180H1176" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="135" y="171" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800">Launch</text>
  <text x="135" y="198" text-anchor="middle" fill="#DBEAFE" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">bounded bootstrap</text>
  <text x="355" y="171" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800">Onboarding</text>
  <text x="355" y="198" text-anchor="middle" fill="#FCE7F3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">1…N slides • ATT if enabled</text>
  <text x="575" y="171" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800">Paywall</text>
  <text x="575" y="198" text-anchor="middle" fill="#FCE7F3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">0…N products</text>
  <text x="805" y="171" text-anchor="middle" fill="#052E16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">Purchase / Restore</text>
  <text x="805" y="198" text-anchor="middle" fill="#064E3B" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Apple or RU checkout</text>
  <text x="1045" y="171" text-anchor="middle" fill="#052E16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">Entitlement</text>
  <text x="1045" y="198" text-anchor="middle" fill="#064E3B" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">active / inactive / unresolved</text>
  <text x="1270" y="171" text-anchor="middle" fill="#422006" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800">Main</text>
  <text x="1270" y="198" text-anchor="middle" fill="#713F12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">verified access</text>
  <rect x="708" y="278" width="434" height="48" rx="16" fill="#64748B"/>
  <text x="925" y="308" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700">StoreKit • Primary backend • RU billing authority</text>
  <path d="M925 278V244" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
