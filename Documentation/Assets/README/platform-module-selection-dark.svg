<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Host app выбирает любой нужный модуль</title>
  <desc id="desc">Четыре независимых варианта подключения. UIFlows зависит от Monetization и Core; Monetization зависит от Core. Extensions подключается отдельно.</desc>
  <rect width="1200" height="500" rx="28" fill="#08111F"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="54" y="66" fill="#F8FAFC" font-size="34" font-weight="750">Один app. Только нужные модули.</text>
    <text x="54" y="108" fill="#9FB0C7" font-size="20">Выберите products под свои сценарии — SwiftPM загрузит их зависимости.</text>
    <rect x="415" y="147" width="370" height="58" rx="16" fill="#F8FAFC"/>
    <text x="600" y="184" text-anchor="middle" fill="#08111F" font-size="22" font-weight="700">Ваше iPhone-приложение</text>
    <path d="M600 205V226M182 251V226H1019V251M461 226V251M740 226V251" fill="none" stroke="#33445F" stroke-width="2"/>
<rect x="54" y="252" width="255" height="150" rx="18" fill="#111C2F" stroke="#33445F"/>
<rect x="74" y="272" width="36" height="5" rx="2" fill="#8B5CF6"/>
<text x="74" y="310" fill="#F8FAFC" font-size="22" font-weight="700">BroadExtensions</text>
<text x="74" y="341" fill="#9FB0C7" font-size="17">Независимые helpers</text>
<text x="74" y="377" fill="#9FB0C7" font-size="15">Без других модулей</text>
<rect x="333" y="252" width="255" height="150" rx="18" fill="#111C2F" stroke="#33445F"/>
<rect x="353" y="272" width="36" height="5" rx="2" fill="#3B82F6"/>
<text x="353" y="310" fill="#F8FAFC" font-size="22" font-weight="700">BroadCore</text>
<text x="353" y="341" fill="#9FB0C7" font-size="17">Запуск, состояния, кеш</text>
<text x="353" y="377" fill="#9FB0C7" font-size="15">Swinject</text>
<rect x="612" y="252" width="255" height="150" rx="18" fill="#111C2F" stroke="#33445F"/>
<rect x="632" y="272" width="36" height="5" rx="2" fill="#10B981"/>
<text x="632" y="310" fill="#F8FAFC" font-size="22" font-weight="700">BroadMonetization</text>
<text x="632" y="341" fill="#9FB0C7" font-size="17">Оплата и доступ</text>
<text x="632" y="377" fill="#9FB0C7" font-size="15">Core + Adapty + Swinject</text>
<rect x="891" y="252" width="255" height="150" rx="18" fill="#111C2F" stroke="#33445F"/>
<rect x="911" y="272" width="36" height="5" rx="2" fill="#EC4899"/>
<text x="911" y="310" fill="#F8FAFC" font-size="22" font-weight="700">BroadUIFlows</text>
<text x="911" y="341" fill="#9FB0C7" font-size="17">Onboarding и paywall</text>
<text x="911" y="377" fill="#9FB0C7" font-size="15">Monetization + Core</text>
    <text x="54" y="454" fill="#9FB0C7" font-size="18">Integration repository: совместимые версии + общий пример + проверки.</text>
  </g>
</svg>
