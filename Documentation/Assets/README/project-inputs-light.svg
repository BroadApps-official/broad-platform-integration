<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">Как определить источник интерфейса и подготовить данные проекта</title>
  <desc id="description">Тип проекта определяется меткой no-code в карточке Kaiten. Затем материалы проекта, reference и backend объединяются в одну конфигурацию приложения; временные значения заменяются перед выпуском.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset="0.55" stop-color="#F8FAFC"/><stop offset="1" stop-color="#FAF5FF"/></linearGradient><filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker></defs>
  <rect width="1280" height="760" rx="34" fill="url(#bg)"/>
  <text x="52" y="58" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="29" font-weight="800">Сначала читаем карточку Kaiten — потом открываем дизайн</text>
  <text x="52" y="88" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Одинаковое правило для работы с Codex, Claude и вручную. Пустое поле Figma не означает no-code.</text>

  <g filter="url(#shadow)"><rect x="430" y="118" width="420" height="82" rx="24" fill="#3B82F6"/></g>
  <text x="640" y="151" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="800">Карточка проекта в Kaiten</text>
  <text x="640" y="177" text-anchor="middle" fill="#DBEAFE" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">проверяем метку проекта, а не пустоту поля Figma</text>
  <path d="M640 200V230" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M640 238L790 292L640 346L490 292Z" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" filter="url(#shadow)"/>
  <text x="640" y="285" text-anchor="middle" fill="#5B21B6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">Есть метка</text><text x="640" y="310" text-anchor="middle" fill="#5B21B6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">no-code?</text>
  <path d="M490 292H302V363" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/><path d="M790 292H978V363" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="370" y="278" fill="#059669" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800">ДА</text><text x="890" y="278" fill="#EA580C" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800">НЕТ</text>
  <g filter="url(#shadow)"><rect x="78" y="374" width="450" height="126" rx="26" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/><rect x="752" y="374" width="450" height="126" rx="26" fill="#FFF7ED" stroke="#F59E0B" stroke-width="3"/></g>
  <text x="303" y="410" text-anchor="middle" fill="#065F46" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">NO-CODE · Figma не ищем</text><text x="303" y="441" text-anchor="middle" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">берём согласованный интерфейс</text><text x="303" y="467" text-anchor="middle" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">из Claude Design / Pencil</text>
  <text x="977" y="410" text-anchor="middle" fill="#9A3412" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">Проект с Figma</text><text x="977" y="441" text-anchor="middle" fill="#C2410C" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">открываем ссылку из документа проекта</text><text x="977" y="467" text-anchor="middle" fill="#C2410C" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">нет ссылки или доступа → запрашиваем у ПМ</text>
  <path d="M303 500V530H510" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/><path d="M977 500V530H770" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="300" y="534" width="680" height="92" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/></g>
  <text x="640" y="568" text-anchor="middle" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800">Собираем один комплект исходных данных</text><text x="640" y="597" text-anchor="middle" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">документ проекта + интерфейс + reference только для чтения + проверенные backend-ручки</text>
  <path d="M640 626V650H350V666" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/><path d="M640 650H930V666" fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="112" y="674" width="476" height="58" rx="20" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/><rect x="692" y="674" width="476" height="58" rx="20" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="350" y="699" text-anchor="middle" fill="#5B21B6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">Разработка: одна AppConfiguration</text><text x="350" y="719" text-anchor="middle" fill="#6D28D9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">временные live-данные явно помечены</text>
  <text x="930" y="699" text-anchor="middle" fill="#065F46" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">Перед выпуском: данные текущего проекта</text><text x="930" y="719" text-anchor="middle" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">временные значения заменены и перечислены</text>
</svg>
