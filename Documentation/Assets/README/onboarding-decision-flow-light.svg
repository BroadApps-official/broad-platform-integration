<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title description">
  <title id="title">Как определить страницы onboarding</title>
  <desc id="description">Агент или разработчик читает материалы проекта, определяет страницы или задаёт вопрос, затем передаёт массив pages в стандартный либо собственный интерфейс.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#FAF5FF"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#64748B" flood-opacity="0.2"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748B"/></marker>
  </defs>
  <rect width="1280" height="590" rx="34" fill="url(#bg)"/>
  <text x="640" y="55" text-anchor="middle" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="800">Onboarding: количество берётся из страниц</text>
  <text x="640" y="87" text-anchor="middle" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Три слайда в BroadAppTemplate — только пример. Значения по умолчанию нет.</text>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="70" y="125" width="260" height="82" rx="22" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/><text x="200" y="158" text-anchor="middle" fill="#1D4ED8" font-size="19" font-weight="800">Kaiten и ТЗ</text><text x="200" y="183" text-anchor="middle" fill="#475569" font-size="15">маршрут и требования</text>
    <rect x="360" y="125" width="260" height="82" rx="22" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/><text x="490" y="158" text-anchor="middle" fill="#6D28D9" font-size="19" font-weight="800">Figma / no-code</text><text x="490" y="183" text-anchor="middle" fill="#475569" font-size="15">экраны и контент</text>
    <rect x="650" y="125" width="260" height="82" rx="22" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="2"/><text x="780" y="158" text-anchor="middle" fill="#BE185D" font-size="19" font-weight="800">Reference</text><text x="780" y="183" text-anchor="middle" fill="#475569" font-size="15">поведение продукта</text>
    <rect x="940" y="125" width="270" height="82" rx="22" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/><text x="1075" y="158" text-anchor="middle" fill="#047857" font-size="19" font-weight="800">Агент / разработчик</text><text x="1075" y="183" text-anchor="middle" fill="#475569" font-size="15">сверяет все источники</text>
  </g>

  <path d="M200 207V236H640V261M490 207V236M780 207V236M1075 207V236H640" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="465" y="267" width="350" height="78" rx="26" fill="url(#flow)"/></g>
  <text x="640" y="299" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">Все страницы понятны?</text>
  <text x="640" y="324" text-anchor="middle" fill="#EDE9FE" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">порядок • заголовок • текст • media • действие</text>

  <path d="M540 345V374H330V397M740 345V374H950V397" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="470" y="371" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">ДА</text>
  <text x="805" y="371" fill="#B45309" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="800">НЕТ / ПРОТИВОРЕЧИЕ</text>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="135" y="402" width="390" height="94" rx="24" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/><text x="330" y="437" text-anchor="middle" fill="#065F46" font-size="20" font-weight="800">Создать массив pages</text><text x="330" y="466" text-anchor="middle" fill="#047857" font-size="16">1 элемент = 1 слайд</text>
    <rect x="755" y="402" width="390" height="94" rx="24" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/><text x="950" y="437" text-anchor="middle" fill="#9A3412" font-size="20" font-weight="800">Сначала задать вопрос</text><text x="950" y="466" text-anchor="middle" fill="#C2410C" font-size="16">не угадывать и не брать «3» молча</text>
  </g>

  <path d="M330 496V530H610M950 496V530H670" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="505" y="515" width="270" height="52" rx="20" fill="#0F172A"/>
  <text x="640" y="547" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="800">Стандартный UI или свой UI</text>
</svg>
