<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title description">
  <title id="title">BroadApps iOS Platform</title>
  <desc id="description">Общая iOS-платформа из BroadCore, BroadMonetization и BroadUIFlows, подключённая к приложению и внешним сервисам.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="0.52" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#FDF2F8"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1280" height="500" rx="36" fill="url(#background)"/>
  <circle cx="1166" cy="72" r="148" fill="#F9A8D4" opacity="0.22"/>
  <circle cx="108" cy="460" r="174" fill="#93C5FD" opacity="0.22"/>
  <text x="74" y="86" fill="#3B82F6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="800" letter-spacing="4">BROADAPPS</text>
  <text x="74" y="153" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="54" font-weight="800">iOS Platform</text>
  <text x="74" y="201" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23">Запуск • монетизация • общие UI-флоу</text>
  <text x="74" y="235" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Clean Architecture + MVVM + SOLID • iOS 17+ • Swift Package Manager</text>

  <g filter="url(#shadow)">
    <rect x="74" y="312" width="186" height="82" rx="22" fill="#F59E0B"/>
    <rect x="316" y="312" width="216" height="82" rx="22" fill="#EC4899"/>
    <rect x="588" y="312" width="244" height="82" rx="22" fill="#10B981"/>
    <rect x="888" y="312" width="188" height="82" rx="22" fill="#3B82F6"/>
    <rect x="970" y="422" width="236" height="54" rx="18" fill="#64748B"/>
  </g>
  <path d="M260 353H302M532 353H574M832 353H874" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M782 396C820 438 888 449 954 449" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="167" y="348" text-anchor="middle" fill="#422006" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">Host App</text>
  <text x="167" y="372" text-anchor="middle" fill="#713F12" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">composition root</text>
  <text x="424" y="361" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">BroadUIFlows</text>
  <text x="710" y="361" text-anchor="middle" fill="#052E16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">BroadMonetization</text>
  <text x="982" y="361" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="800">BroadCore</text>
  <text x="1088" y="456" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Adapty • StoreKit • Backends</text>
</svg>
