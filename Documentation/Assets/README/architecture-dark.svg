  <path d="M448 142V112H1058V128" fill="none" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="753" y="106" text-anchor="middle" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="700">BroadUIFlows напрямую зависит от BroadCore</text>
  <text x="164" y="190" text-anchor="middle" fill="#422006" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="800">Приложение</text>
