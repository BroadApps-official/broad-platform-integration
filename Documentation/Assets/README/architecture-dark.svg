<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Границы модулей BroadApps iOS Platform</title>
  <desc id="description">Приложение зависит от BroadUIFlows и при необходимости напрямую от независимого BroadExtensions. BroadUIFlows зависит от BroadMonetization и BroadCore, BroadMonetization от BroadCore и внешних adapters.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94A3B8"/></marker>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity="0.38"/></filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="#0F172A"/>
  <text x="54" y="58" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="800">Кто за что отвечает</text>
  <text x="54" y="87" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Зависимости направлены только вправо. SDK и backend DTO остаются за adapter-границей.</text>
  <g filter="url(#shadow)">
    <rect x="54" y="142" width="220" height="142" rx="24" fill="#F59E0B"/>
    <rect x="328" y="142" width="240" height="142" rx="24" fill="#EC4899"/>
