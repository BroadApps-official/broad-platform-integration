<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title description">
  <title id="title">Как читать результат проверки в Terminal</title>
  <desc id="description">Слева показан успешный PASS из пяти этапов, справа — понятная ошибка с названием этапа, последними строками, путём к полному логу и действием разработчика.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF6FF"/><stop offset="0.55" stop-color="#F8FAFC"/><stop offset="1" stop-color="#F5F3FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1400" height="720" rx="34" fill="url(#bg)"/>
  <text x="58" y="62" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="800">ЧТО ВЫ УВИДИТЕ В TERMINAL</text>
  <text x="58" y="96" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Каждый этап имеет номер. При ошибке сразу видны причина, полный лог и следующее действие.</text>

  <g filter="url(#shadow)" font-family="SFMono-Regular,Menlo,monospace">
    <rect x="48" y="134" width="624" height="404" rx="28" fill="#0F172A"/>
    <rect x="48" y="134" width="624" height="50" rx="28" fill="#1E293B"/>
    <circle cx="80" cy="159" r="7" fill="#FB7185"/><circle cx="102" cy="159" r="7" fill="#FBBF24"/><circle cx="124" cy="159" r="7" fill="#34D399"/>
    <text x="360" y="165" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="700">PASS · всё в порядке</text>
    <text x="80" y="221" fill="#60A5FA" font-size="16">[1/5]</text><text x="148" y="221" fill="#F8FAFC" font-size="16">Правила и архитектура</text><text x="622" y="221" text-anchor="end" fill="#34D399" font-size="16">✓</text>
    <text x="80" y="265" fill="#60A5FA" font-size="16">[2/5]</text><text x="148" y="265" fill="#F8FAFC" font-size="16">Форматирование</text><text x="622" y="265" text-anchor="end" fill="#34D399" font-size="16">✓</text>
    <text x="80" y="309" fill="#60A5FA" font-size="16">[3/5]</text><text x="148" y="309" fill="#F8FAFC" font-size="16">SwiftLint</text><text x="622" y="309" text-anchor="end" fill="#34D399" font-size="16">✓</text>
    <text x="80" y="353" fill="#60A5FA" font-size="16">[4/5]</text><text x="148" y="353" fill="#F8FAFC" font-size="16">Debug / Release</text><text x="622" y="353" text-anchor="end" fill="#34D399" font-size="16">✓</text>
    <text x="80" y="397" fill="#60A5FA" font-size="16">[5/5]</text><text x="148" y="397" fill="#F8FAFC" font-size="16">Adapty-конфигурации</text><text x="622" y="397" text-anchor="end" fill="#34D399" font-size="16">✓</text>
    <rect x="78" y="432" width="564" height="76" rx="18" fill="#052E2A" stroke="#10B981" stroke-width="2"/>
    <text x="102" y="463" fill="#6EE7B7" font-size="17" font-weight="800">✓ PASS · платформа проверена</text>
    <text x="102" y="490" fill="#A7F3D0" font-size="13">Можно открыть отчёт и перейти к review.</text>

    <rect x="728" y="134" width="624" height="404" rx="28" fill="#0F172A"/>
    <rect x="728" y="134" width="624" height="50" rx="28" fill="#1E293B"/>
    <circle cx="760" cy="159" r="7" fill="#FB7185"/><circle cx="782" cy="159" r="7" fill="#FBBF24"/><circle cx="804" cy="159" r="7" fill="#34D399"/>
    <text x="1040" y="165" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="700">FAIL · есть конкретная причина</text>
    <text x="760" y="221" fill="#60A5FA" font-size="16">[2/5]</text><text x="828" y="221" fill="#F8FAFC" font-size="16">Форматирование Swift-кода</text>
    <text x="760" y="265" fill="#FB7185" font-size="16" font-weight="800">✗ Ошибка · код 1</text>
    <text x="760" y="309" fill="#F8FAFC" font-size="14">Последние строки:</text>
    <text x="780" y="339" fill="#FCA5A5" font-size="13">Sources/.../PaywallView.swift</text>
    <text x="780" y="364" fill="#CBD5E1" font-size="13">file is not formatted</text>
    <text x="760" y="410" fill="#94A3B8" font-size="13">→ Полный лог: .build/GateLogs/02-format.log</text>
    <rect x="758" y="432" width="564" height="76" rx="18" fill="#3A1822" stroke="#FB7185" stroke-width="2"/>
    <text x="782" y="463" fill="#FDA4AF" font-size="15" font-weight="800">Что делать</text>
    <text x="782" y="490" fill="#FFE4E6" font-size="13">Исправить причину и повторить ту же команду.</text>
  </g>

  <rect x="48" y="572" width="1304" height="102" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="76" y="610" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="800">ВАЖНО · это вывод проверки самой платформы</text>
  <text x="76" y="641" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Если проверяется новое приложение, список недостающих экранов, данных и API агент пишет в текущем чате и в своём итоговом отчёте.</text>
</svg>
