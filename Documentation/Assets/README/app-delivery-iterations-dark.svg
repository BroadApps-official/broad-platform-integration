<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Две итерации создания iPhone-приложения</title>
  <desc id="desc">Сначала проверяются источники и функциональность, затем каждый экран визуально сверяется с исходным дизайном, просматривается разработчиком и передаётся QA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8798b8"/>
    </marker>
  </defs>
  <rect width="1440" height="500" rx="34" fill="url(#bg)"/>
  <text x="64" y="66" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Сначала работает. Затем совпадает с дизайном.</text>
  <text x="64" y="104" fill="#aebbd2" font-family="Arial, sans-serif" font-size="19">QA получает приложение только после функционального PASS, визуальной сверки и личного просмотра разработчиком.</text>

  <rect x="48" y="138" width="630" height="246" rx="26" fill="#14213a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="702" y="138" width="690" height="246" rx="26" fill="#20172f" stroke="#8b5cf6" stroke-width="2"/>
  <text x="72" y="172" fill="#75adff" font-family="Arial, sans-serif" font-size="18" font-weight="700">ИТЕРАЦИЯ 1 · ФУНКЦИОНАЛЬНАЯ</text>
  <text x="726" y="172" fill="#bd9cff" font-family="Arial, sans-serif" font-size="18" font-weight="700">ИТЕРАЦИЯ 2 · ВИЗУАЛЬНАЯ И ПЕРЕДАЧА</text>

  <g font-family="Arial, sans-serif">
    <rect x="64" y="194" width="180" height="148" rx="20" fill="#1c2c4b" stroke="#3b82f6"/>
    <text x="154" y="226" text-anchor="middle" fill="#75adff" font-size="14" font-weight="700">1 · PREFLIGHT</text>
    <text x="154" y="264" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Источники</text>
    <text x="154" y="290" text-anchor="middle" fill="#aebbd2" font-size="14">Kaiten · design</text>
    <text x="154" y="312" text-anchor="middle" fill="#aebbd2" font-size="14">reference · backend</text>

    <rect x="270" y="194" width="180" height="148" rx="20" fill="#1c2c4b" stroke="#3b82f6"/>
    <text x="360" y="226" text-anchor="middle" fill="#75adff" font-size="14" font-weight="700">2 · BUILD</text>
    <text x="360" y="264" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Функции</text>
    <text x="360" y="290" text-anchor="middle" fill="#aebbd2" font-size="14">routes · API</text>
    <text x="360" y="312" text-anchor="middle" fill="#aebbd2" font-size="14">paywalls · offline</text>

    <rect x="476" y="194" width="180" height="148" rx="20" fill="#12352f" stroke="#10b981"/>
    <text x="566" y="226" text-anchor="middle" fill="#5ee6b7" font-size="14" font-weight="700">3 · FUNCTION PASS</text>
    <text x="566" y="264" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Debug + Release</text>
    <text x="566" y="290" text-anchor="middle" fill="#aebbd2" font-size="14">safe scenarios</text>
    <text x="566" y="312" text-anchor="middle" fill="#aebbd2" font-size="14">без оплаты</text>

    <rect x="720" y="194" width="190" height="148" rx="20" fill="#302447" stroke="#8b5cf6"/>
    <text x="815" y="226" text-anchor="middle" fill="#bd9cff" font-size="14" font-weight="700">4 · SCREEN MATCH</text>
    <text x="815" y="264" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Source ↔ Simulator</text>
    <text x="815" y="290" text-anchor="middle" fill="#aebbd2" font-size="14">один iPhone</text>
    <text x="815" y="312" text-anchor="middle" fill="#aebbd2" font-size="14">повтор до совпадения</text>

    <rect x="936" y="194" width="190" height="148" rx="20" fill="#302447" stroke="#8b5cf6"/>
    <text x="1031" y="226" text-anchor="middle" fill="#bd9cff" font-size="14" font-weight="700">5 · SELF REVIEW</text>
    <text x="1031" y="264" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Разработчик</text>
    <text x="1031" y="290" text-anchor="middle" fill="#aebbd2" font-size="14">смотрит сам</text>
    <text x="1031" y="312" text-anchor="middle" fill="#aebbd2" font-size="14">исправляет замечания</text>

    <rect x="1152" y="194" width="190" height="148" rx="20" fill="#3a2b12" stroke="#f59e0b"/>
    <text x="1247" y="226" text-anchor="middle" fill="#ffc766" font-size="14" font-weight="700">6 · QA</text>
    <text x="1247" y="264" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Передача</text>
    <text x="1247" y="290" text-anchor="middle" fill="#aebbd2" font-size="14">только после</text>
    <text x="1247" y="312" text-anchor="middle" fill="#aebbd2" font-size="14">двух итераций</text>
  </g>

  <g stroke="#8798b8" stroke-width="3" marker-end="url(#arrow)">
    <line x1="244" y1="268" x2="262" y2="268"/>
    <line x1="450" y1="268" x2="468" y2="268"/>
    <line x1="656" y1="268" x2="710" y2="268"/>
    <line x1="910" y1="268" x2="928" y2="268"/>
    <line x1="1126" y1="268" x2="1144" y2="268"/>
  </g>

  <text x="64" y="430" fill="#ff8aa0" font-family="Arial, sans-serif" font-size="18" font-weight="700">НЕЛЬЗЯ:</text>
  <text x="156" y="430" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18">называть «похожий UI» готовым · пропускать экран без источника · отдавать QA после одной сборки</text>
  <text x="1120" y="472" fill="#7787a5" font-family="Arial, sans-serif" font-size="15">BroadApps iOS Platform</text>
</svg>
