<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Семь этапов создания iPhone-приложения</title>
  <desc id="desc">Preflight, Integration Plan, skeleton, один вертикальный срез, functional review, visual review и acceptance. Каждый этап заканчивается developer checkpoint. Заблокированная функция ждёт evidence и затем возвращается к остановленному этапу.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F7FF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#FAF5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748B" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1440" height="640" rx="34" fill="url(#bg)"/>
  <text x="56" y="58" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="800">Семь этапов. Ни один checkpoint не пропускаем.</text>
  <text x="56" y="92" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Один prompt — один stage. Agent и ручная разработка используют одинаковый порядок.</text>

  <rect x="36" y="116" width="972" height="32" rx="16" fill="#DBEAFE"/>
  <text x="522" y="138" text-anchor="middle" fill="#1E40AF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">ФУНКЦИОНАЛЬНАЯ ОСНОВА · ЭТАПЫ 0–4</text>
  <rect x="1026" y="116" width="378" height="32" rx="16" fill="#EDE9FE"/>
  <text x="1215" y="138" text-anchor="middle" fill="#6D28D9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">VISUAL + HANDOFF · 5–6</text>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" filter="url(#shadow)">
    <rect x="36" y="166" width="180" height="188" rx="22" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="36" y="166" width="180" height="38" rx="22" fill="#DBEAFE"/><rect x="36" y="186" width="180" height="18" fill="#DBEAFE"/>
    <text x="126" y="191" text-anchor="middle" fill="#1D4ED8" font-size="13" font-weight="800">0 · PREFLIGHT</text>
    <text x="126" y="240" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="800">Только чтение</text>
    <text x="126" y="269" text-anchor="middle" fill="#475569" font-size="14">requirements · design</text>
    <text x="126" y="291" text-anchor="middle" fill="#475569" font-size="14">backend · decisions</text>
    <rect x="56" y="312" width="140" height="25" rx="12.5" fill="#EFF6FF"/>
    <text x="126" y="329" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="800">READY / BLOCKED</text>

    <rect x="234" y="166" width="180" height="188" rx="22" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
    <rect x="234" y="166" width="180" height="38" rx="22" fill="#E0E7FF"/><rect x="234" y="186" width="180" height="18" fill="#E0E7FF"/>
    <text x="324" y="191" text-anchor="middle" fill="#4338CA" font-size="13" font-weight="800">1 · PLAN</text>
    <text x="324" y="240" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="800">Без Swift</text>
    <text x="324" y="269" text-anchor="middle" fill="#475569" font-size="14">screens · API</text>
    <text x="324" y="291" text-anchor="middle" fill="#475569" font-size="14">ownership · slices</text>
    <rect x="248" y="312" width="152" height="25" rx="12.5" fill="#EEF2FF"/>
    <text x="324" y="329" text-anchor="middle" fill="#4338CA" font-size="10.5" font-weight="800">PLAN REVIEW</text>

    <rect x="432" y="166" width="180" height="188" rx="22" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
    <rect x="432" y="166" width="180" height="38" rx="22" fill="#CFFAFE"/><rect x="432" y="186" width="180" height="18" fill="#CFFAFE"/>
    <text x="522" y="191" text-anchor="middle" fill="#0E7490" font-size="13" font-weight="800">2 · SKELETON</text>
    <text x="522" y="240" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="800">Границы + build</text>
    <text x="522" y="269" text-anchor="middle" fill="#475569" font-size="14">target · DI · routes</text>
    <text x="522" y="291" text-anchor="middle" fill="#475569" font-size="14">без fake backend</text>
    <rect x="446" y="312" width="152" height="25" rx="12.5" fill="#ECFEFF"/>
    <text x="522" y="329" text-anchor="middle" fill="#0E7490" font-size="10.5" font-weight="800">SKELETON REVIEW</text>

    <rect x="630" y="166" width="180" height="188" rx="22" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <rect x="630" y="166" width="180" height="38" rx="22" fill="#CCFBF1"/><rect x="630" y="186" width="180" height="18" fill="#CCFBF1"/>
    <text x="720" y="191" text-anchor="middle" fill="#0F766E" font-size="13" font-weight="800">3 · ONE SLICE</text>
    <text x="720" y="240" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="800">Один flow</text>
    <text x="720" y="269" text-anchor="middle" fill="#475569" font-size="14">View → backend</text>
    <text x="720" y="291" text-anchor="middle" fill="#475569" font-size="14">states · retry · logs</text>
    <rect x="644" y="312" width="152" height="25" rx="12.5" fill="#F0FDFA"/>
    <text x="720" y="329" text-anchor="middle" fill="#0F766E" font-size="10.5" font-weight="800">SLICE REVIEW</text>

    <rect x="828" y="166" width="180" height="188" rx="22" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="828" y="166" width="180" height="38" rx="22" fill="#D1FAE5"/><rect x="828" y="186" width="180" height="18" fill="#D1FAE5"/>
    <text x="918" y="191" text-anchor="middle" fill="#047857" font-size="13" font-weight="800">4 · FUNCTIONAL</text>
    <text x="918" y="240" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="800">Поведение</text>
    <text x="918" y="269" text-anchor="middle" fill="#475569" font-size="14">Debug · Release</text>
    <text x="918" y="291" text-anchor="middle" fill="#475569" font-size="14">API · offline · paywall</text>
    <rect x="838" y="312" width="160" height="25" rx="12.5" fill="#ECFDF5"/>
    <text x="918" y="329" text-anchor="middle" fill="#047857" font-size="9.8" font-weight="800">FUNCTIONAL REVIEW</text>

    <rect x="1026" y="166" width="180" height="188" rx="22" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="1026" y="166" width="180" height="38" rx="22" fill="#EDE9FE"/><rect x="1026" y="186" width="180" height="18" fill="#EDE9FE"/>
    <text x="1116" y="191" text-anchor="middle" fill="#6D28D9" font-size="13" font-weight="800">5 · VISUAL</text>
    <text x="1116" y="240" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="800">Точный source</text>
    <text x="1116" y="269" text-anchor="middle" fill="#475569" font-size="14">small + large iPhone</text>
    <text x="1116" y="291" text-anchor="middle" fill="#475569" font-size="14">screenshot diff</text>
    <rect x="1040" y="312" width="152" height="25" rx="12.5" fill="#F5F3FF"/>
    <text x="1116" y="329" text-anchor="middle" fill="#6D28D9" font-size="10.5" font-weight="800">VISUAL REVIEW</text>

    <rect x="1224" y="166" width="180" height="188" rx="22" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <rect x="1224" y="166" width="180" height="38" rx="22" fill="#FEF3C7"/><rect x="1224" y="186" width="180" height="18" fill="#FEF3C7"/>
    <text x="1314" y="191" text-anchor="middle" fill="#B45309" font-size="13" font-weight="800">6 · ACCEPTANCE</text>
    <text x="1314" y="240" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="800">Handoff</text>
    <text x="1314" y="269" text-anchor="middle" fill="#475569" font-size="14">config · evidence</text>
    <text x="1314" y="291" text-anchor="middle" fill="#475569" font-size="14">QA steps · logs</text>
    <rect x="1238" y="312" width="152" height="25" rx="12.5" fill="#FFFBEB"/>
    <text x="1314" y="329" text-anchor="middle" fill="#B45309" font-size="10.5" font-weight="800">READY FOR QA</text>
  </g>

  <g stroke="#64748B" stroke-width="3" marker-end="url(#arrow)">
    <line x1="216" y1="260" x2="228" y2="260"/><line x1="414" y1="260" x2="426" y2="260"/>
    <line x1="612" y1="260" x2="624" y2="260"/><line x1="810" y1="260" x2="822" y2="260"/>
    <line x1="1008" y1="260" x2="1020" y2="260"/><line x1="1206" y1="260" x2="1218" y2="260"/>
  </g>

  <rect x="48" y="404" width="1344" height="134" rx="26" fill="#FFF1F2" stroke="#FB7185" stroke-width="2"/>
  <text x="76" y="438" fill="#BE123C" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">ВЕТКА BLOCKED · НЕ ПОДМЕНЯЕМ ДОГАДКОЙ</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="76" y="458" width="270" height="54" rx="17" fill="#FFFFFF" stroke="#FDA4AF"/>
    <text x="211" y="480" text-anchor="middle" fill="#9F1239" font-size="15" font-weight="800">1 · Остановить одну функцию</text>
    <text x="211" y="500" text-anchor="middle" fill="#64748B" font-size="12.5">остальные READY могут продолжить</text>
    <rect x="388" y="458" width="270" height="54" rx="17" fill="#FFFFFF" stroke="#FDA4AF"/>
    <text x="523" y="480" text-anchor="middle" fill="#9F1239" font-size="15" font-weight="800">2 · Получить evidence</text>
    <text x="523" y="500" text-anchor="middle" fill="#64748B" font-size="12.5">PM · designer · backend owner</text>
    <rect x="700" y="458" width="270" height="54" rx="17" fill="#FFFFFF" stroke="#FDA4AF"/>
    <text x="835" y="480" text-anchor="middle" fill="#9F1239" font-size="15" font-weight="800">3 · Обновить Plan</text>
    <text x="835" y="500" text-anchor="middle" fill="#64748B" font-size="12.5">только связанные строки</text>
    <rect x="1012" y="458" width="350" height="54" rx="17" fill="#FFFFFF" stroke="#FDA4AF"/>
    <text x="1187" y="480" text-anchor="middle" fill="#9F1239" font-size="15" font-weight="800">4 · Вернуться к тому же stage</text>
    <text x="1187" y="500" text-anchor="middle" fill="#64748B" font-size="12.5">принятые этапы не генерировать заново</text>
  </g>
  <g stroke="#BE123C" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="346" y1="485" x2="380" y2="485"/><line x1="658" y1="485" x2="692" y2="485"/><line x1="970" y1="485" x2="1004" y2="485"/>
  </g>

  <text x="56" y="590" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700">Важно: platform PASS проверяет основу. READY FOR QA подтверждает конкретное приложение.</text>
  <text x="1384" y="610" text-anchor="end" fill="#64748B" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">BroadApps iOS Platform</text>
</svg>
