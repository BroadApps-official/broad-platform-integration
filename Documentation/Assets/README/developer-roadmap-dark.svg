<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title description">
  <title id="title">Два способа собрать приложение на BroadApps iOS Platform</title>
  <desc id="description">Сначала разработчик собирает исходные материалы, затем выбирает работу с Codex или Claude либо ручную работу в Xcode. Оба пути заканчиваются одинаковой проверкой iPhone-приложения.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#24113B"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="manual" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1280" height="700" rx="36" fill="url(#background)"/>
  <circle cx="1160" cy="70" r="150" fill="#7C3AED" opacity="0.17"/>
  <circle cx="90" cy="640" r="170" fill="#0EA5E9" opacity="0.12"/>

  <text x="640" y="64" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="800">Один результат — два способа работы</text>
  <text x="640" y="98" text-anchor="middle" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Выберите исполнителя. Набор этапов и правила качества не меняются.</text>

  <g filter="url(#shadow)">
    <rect x="82" y="130" width="1116" height="116" rx="26" fill="#172033" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="112" y="168" fill="#93C5FD" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="1.8">1  ПОДГОТОВЬТЕ ИСХОДНЫЕ МАТЕРИАЛЫ</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="112" y="190" width="220" height="36" rx="18" fill="#1E3A5F"/><text x="222" y="214" fill="#DBEAFE">Документ Kaiten</text>
    <rect x="352" y="190" width="220" height="36" rx="18" fill="#3B255F"/><text x="462" y="214" fill="#EDE9FE" font-size="14">Метка Kaiten → дизайн</text>
    <rect x="592" y="190" width="220" height="36" rx="18" fill="#3B2B1F"/><text x="702" y="214" fill="#FFEDD5">Reference или «НАЙДИ»</text>
    <rect x="832" y="190" width="336" height="36" rx="18" fill="#123C36"/><text x="1000" y="214" fill="#D1FAE5">Папка приложения + доступ к Git</text>
  </g>

  <path d="M640 246V276M640 276H340V302M640 276H940V302" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="82" y="306" width="536" height="238" rx="28" fill="url(#agent)"/>
    <rect x="662" y="306" width="536" height="238" rx="28" fill="url(#manual)"/>
  </g>

  <text x="112" y="352" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="800">2A  С CODEX ИЛИ CLAUDE</text>
  <text x="112" y="382" fill="#DBEAFE" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Откройте папку и вставьте готовый промпт из README.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <circle cx="126" cy="425" r="16" fill="#FFFFFF" opacity="0.2"/><text x="126" y="431" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">1</text>
    <text x="154" y="431" fill="#FFFFFF" font-size="17" font-weight="700">Агент создаёт проект и подключает модули</text>
    <circle cx="126" cy="468" r="16" fill="#FFFFFF" opacity="0.2"/><text x="126" y="474" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">2</text>
    <text x="154" y="474" fill="#FFFFFF" font-size="17" font-weight="700">Вы проверяете его отчёт по списку</text>
    <circle cx="126" cy="511" r="16" fill="#FFFFFF" opacity="0.2"/><text x="126" y="517" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">3</text>
    <text x="154" y="517" fill="#FFFFFF" font-size="17" font-weight="700">Вставляете промпт проверки и получаете PASS</text>
  </g>

  <text x="692" y="352" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="800">2B  БЕЗ АГЕНТА, В XCODE</text>
  <text x="692" y="382" fill="#FFEDD5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Выполните ручную инструкцию от шага 0 до шага 9.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <circle cx="706" cy="425" r="16" fill="#FFFFFF" opacity="0.2"/><text x="706" y="431" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">1</text>
    <text x="734" y="431" fill="#FFFFFF" font-size="17" font-weight="700">Создаёте проект и подключаете модули</text>
    <circle cx="706" cy="468" r="16" fill="#FFFFFF" opacity="0.2"/><text x="706" y="474" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">2</text>
    <text x="734" y="474" fill="#FFFFFF" font-size="17" font-weight="700">Собираете UI, оплату и восстановление</text>
    <circle cx="706" cy="511" r="16" fill="#FFFFFF" opacity="0.2"/><text x="706" y="517" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">3</text>
    <text x="734" y="517" fill="#FFFFFF" font-size="17" font-weight="700">Сами проходите тот же список проверок</text>
  </g>

  <path d="M350 544V568C350 588 382 598 424 598H620" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M930 544V568C930 588 898 598 856 598H660" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="202" y="586" width="876" height="86" rx="28" fill="url(#result)"/>
  </g>
  <text x="640" y="621" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800">3  ГОТОВОЕ iPHONE-ПРИЛОЖЕНИЕ</text>
  <text x="640" y="649" text-anchor="middle" fill="#D1FAE5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600">Debug + Release • безопасные сценарии • подтверждённый доступ • список временных данных</text>
</svg>
