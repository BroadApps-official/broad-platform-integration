<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title description">
  <title id="title">No-code-разработка вручную в Xcode</title>
  <desc id="description">Разработчик самостоятельно берёт материалы из Kaiten и согласованный дизайн, создаёт iPhone-проект в Xcode, подключает платформу, собирает интерфейс и backend, затем выполняет проверки.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22140C"/><stop offset="0.5" stop-color="#111827"/><stop offset="1" stop-color="#2A1022"/></linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#047857"/><stop offset="1" stop-color="#0F766E"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.38"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="1400" height="720" rx="36" fill="url(#bg)"/><circle cx="1280" cy="80" r="170" fill="#BE185D" opacity="0.14"/><circle cx="70" cy="680" r="180" fill="#EA580C" opacity="0.12"/>
  <text x="60" y="62" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="800">NO-CODE ВРУЧНУЮ · БЕЗ АГЕНТА</text>
  <text x="60" y="94" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Здесь каждый шаг выполняет разработчик. Согласованный дизайн остаётся источником интерфейса, платформа — источником поведения.</text>
  <text x="60" y="145" fill="#FDBA74" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">СНАЧАЛА ПОДГОТОВЬТЕ ИСХОДНИКИ</text>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="60" y="166" width="390" height="118" rx="24" fill="#241B18" stroke="#FB923C" stroke-width="2"/><text x="90" y="200" fill="#FDBA74" font-size="14" font-weight="800">1 · KAITEN</text><text x="90" y="230" fill="#F8FAFC" font-size="19" font-weight="800">Карточка с меткой no-code</text><text x="90" y="257" fill="#CBD5E1" font-size="14">документ проекта и доступные данные</text>
    <rect x="505" y="166" width="390" height="118" rx="24" fill="#251D3B" stroke="#A78BFA" stroke-width="2"/><text x="535" y="200" fill="#C4B5FD" font-size="14" font-weight="800">2 · СОГЛАСОВАННЫЙ ДИЗАЙН</text><text x="535" y="230" fill="#F8FAFC" font-size="19" font-weight="800">Claude Design или Pencil</text><text x="535" y="257" fill="#CBD5E1" font-size="14">экраны, состояния, тексты и assets</text>
    <rect x="950" y="166" width="390" height="118" rx="24" fill="#102536" stroke="#38BDF8" stroke-width="2"/><text x="980" y="200" fill="#7DD3FC" font-size="14" font-weight="800">3 · REFERENCE И BACKEND</text><text x="980" y="230" fill="#F8FAFC" font-size="19" font-weight="800">Только читать и сверять</text><text x="980" y="257" fill="#CBD5E1" font-size="14">сценарии, API-ручки и контракты</text>
  </g>
  <path d="M700 284V326" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="60" y="368" fill="#F9A8D4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">ЗАТЕМ СОБЕРИТЕ ПРИЛОЖЕНИЕ В XCODE</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="60" y="392" width="226" height="126" rx="24" fill="#2B1D17" stroke="#FB923C" stroke-width="2"/><text x="173" y="426" fill="#FDBA74" font-size="14" font-weight="800">4 · НОВЫЙ ПРОЕКТ</text><text x="173" y="457" fill="#F8FAFC" font-size="18" font-weight="800">Xcode → File → New</text><text x="173" y="484" fill="#CBD5E1" font-size="14">iOS App · SwiftUI · без Tests</text>
    <rect x="322" y="392" width="226" height="126" rx="24" fill="#152B4B" stroke="#60A5FA" stroke-width="2"/><text x="435" y="426" fill="#93C5FD" font-size="14" font-weight="800">5 · PACKAGE</text><text x="435" y="457" fill="#F8FAFC" font-size="18" font-weight="800">Add Package</text><text x="435" y="484" fill="#CBD5E1" font-size="14">подключить нужные модули</text>
    <rect x="584" y="392" width="226" height="126" rx="24" fill="#312256" stroke="#A78BFA" stroke-width="2"/><text x="697" y="426" fill="#C4B5FD" font-size="14" font-weight="800">6 · ОСНОВА</text><text x="697" y="457" fill="#F8FAFC" font-size="18" font-weight="800">AppConfiguration</text><text x="697" y="484" fill="#CBD5E1" font-size="14">Core → Monetization → UI</text>
    <rect x="846" y="392" width="226" height="126" rx="24" fill="#3A1830" stroke="#F472B6" stroke-width="2"/><text x="959" y="426" fill="#F9A8D4" font-size="14" font-weight="800">7 · ПРОДУКТ</text><text x="959" y="457" fill="#F8FAFC" font-size="18" font-weight="800">SwiftUI + API</text><text x="959" y="484" fill="#CBD5E1" font-size="14">экраны, маршруты, backend</text>
    <rect x="1108" y="392" width="232" height="126" rx="24" fill="#123C36" stroke="#34D399" stroke-width="2"/><text x="1224" y="426" fill="#6EE7B7" font-size="14" font-weight="800">8 · ПРОВЕРКА</text><text x="1224" y="457" fill="#F8FAFC" font-size="18" font-weight="800">Debug + Release</text><text x="1224" y="484" fill="#CBD5E1" font-size="14">checklist без оплаты</text>
  </g>
  <path d="M286 455H308M548 455H570M810 455H832M1072 455H1094" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M700 518V558" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="126" y="578" width="1148" height="92" rx="28" fill="url(#done)" filter="url(#shadow)"/><text x="700" y="615" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800">ГОТОВО: тот же результат, но ответственность за каждый шаг лежит на разработчике</text><text x="700" y="645" text-anchor="middle" fill="#D1FAE5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">iPhone-приложение · проверенный пользовательский путь · временные данные перечислены · нерешённые вопросы зафиксированы</text>
</svg>
