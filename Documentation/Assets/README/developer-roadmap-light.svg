<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title description">
  <title id="title">Два способа собрать приложение на BroadApps iOS Platform</title>
  <desc id="description">После исходных материалов разработчик выбирает агента или ручную работу. Оба пути используют Integration Plan, stages, checkpoints и отдельную app acceptance.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="0.52" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#FAF5FF"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="manual" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#64748B" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1280" height="700" rx="36" fill="url(#background)"/>
  <circle cx="1160" cy="70" r="150" fill="#A78BFA" opacity="0.18"/>
  <circle cx="90" cy="640" r="170" fill="#38BDF8" opacity="0.14"/>

  <text x="640" y="64" text-anchor="middle" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="800">Один результат — два способа работы</text>
  <text x="640" y="98" text-anchor="middle" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Выберите исполнителя. Набор этапов и правила качества не меняются.</text>

  <g filter="url(#shadow)">
    <rect x="82" y="130" width="1116" height="116" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <text x="112" y="168" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="1.8">1  ПОДГОТОВЬТЕ ИСХОДНЫЕ МАТЕРИАЛЫ</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="112" y="190" width="220" height="36" rx="18" fill="#DBEAFE"/><text x="222" y="214" fill="#1E3A8A">Документ Kaiten</text>
    <rect x="352" y="190" width="220" height="36" rx="18" fill="#EDE9FE"/><text x="462" y="214" fill="#5B21B6" font-size="14">Метка Kaiten → дизайн</text>
    <rect x="592" y="190" width="220" height="36" rx="18" fill="#FFEDD5"/><text x="702" y="214" fill="#9A3412">Reference или «НАЙДИ»</text>
    <rect x="832" y="190" width="336" height="36" rx="18" fill="#D1FAE5"/><text x="1000" y="214" fill="#065F46">Папка приложения + доступ к Git</text>
  </g>

  <path d="M640 246V276M640 276H340V302M640 276H940V302" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="82" y="306" width="536" height="238" rx="28" fill="url(#agent)"/>
    <rect x="662" y="306" width="536" height="238" rx="28" fill="url(#manual)"/>
  </g>

  <text x="112" y="352" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="800">2A  С CODEX ИЛИ CLAUDE</text>
  <text x="112" y="382" fill="#DBEAFE" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Откройте папку. Отправляйте prompts по одному.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <circle cx="126" cy="425" r="16" fill="#FFFFFF" opacity="0.2"/><text x="126" y="431" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">1</text>
    <text x="154" y="431" fill="#FFFFFF" font-size="17" font-weight="700">Plan → skeleton после checkpoint</text>
    <circle cx="126" cy="468" r="16" fill="#FFFFFF" opacity="0.2"/><text x="126" y="474" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">2</text>
    <text x="154" y="474" fill="#FFFFFF" font-size="17" font-weight="700">Один slice → developer review</text>
    <circle cx="126" cy="511" r="16" fill="#FFFFFF" opacity="0.2"/><text x="126" y="517" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">3</text>
    <text x="154" y="517" fill="#FFFFFF" font-size="17" font-weight="700">Functional → visual → acceptance</text>
  </g>

  <text x="692" y="352" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="800">2B  БЕЗ АГЕНТА, В XCODE</text>
  <text x="692" y="382" fill="#FFEDD5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Те же stages выполняются вручную в Xcode.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <circle cx="706" cy="425" r="16" fill="#FFFFFF" opacity="0.2"/><text x="706" y="431" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">1</text>
    <text x="734" y="431" fill="#FFFFFF" font-size="17" font-weight="700">Plan → target → platform modules</text>
    <circle cx="706" cy="468" r="16" fill="#FFFFFF" opacity="0.2"/><text x="706" y="474" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">2</text>
    <text x="734" y="474" fill="#FFFFFF" font-size="17" font-weight="700">Один vertical slice за раз</text>
    <circle cx="706" cy="511" r="16" fill="#FFFFFF" opacity="0.2"/><text x="706" y="517" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">3</text>
    <text x="734" y="517" fill="#FFFFFF" font-size="17" font-weight="700">Functional → visual → acceptance</text>
  </g>

  <path d="M350 544V568C350 588 382 598 424 598H620" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M930 544V568C930 588 898 598 856 598H660" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="202" y="586" width="876" height="86" rx="28" fill="url(#result)"/>
  </g>
  <text x="640" y="621" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="800">3  READY FOR QA ПОСЛЕ ACCEPTANCE</text>
  <text x="640" y="649" text-anchor="middle" fill="#D1FAE5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600">Debug + Release • безопасные сценарии • подтверждённый доступ • список временных данных</text>
</svg>
